<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis cuentas</title>
<style>
  :root {
    --bg: #EDE7D8;
    --surface: #F5F1E6;
    --ink: #2A2620;
    --ink-soft: #6B6354;
    --rule: #D6CBB0;
    --income: #3F6C51;
    --income-bg: #E3EAE0;
    --expense: #8C3B2E;
    --expense-bg: #F1E1DB;
    --accent: #1F4E5F;
    --accent-contrast: #F5F1E6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 460px; margin: 0 auto; padding: 20px 18px 48px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .app-name { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .month-nav { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
  .month-nav button { background: none; border: none; color: var(--ink); font-size: 17px; cursor: pointer; padding: 2px 6px; line-height: 1; }
  .hero { text-align: center; padding: 18px 0 22px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
  .balance-number {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 42px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .balance-number.negative { color: var(--expense); }
  .balance-label { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .stats-row { display: flex; justify-content: center; gap: 28px; margin-top: 16px; }
  .stat-value { font-family: Georgia, serif; font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat-income .stat-value { color: var(--income); }
  .stat-expense .stat-value { color: var(--expense); }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .form-section { background: var(--surface); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  .type-toggle { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 14px; }
  .type-btn { flex: 1; border: none; background: none; padding: 8px 0; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); border-radius: 6px; cursor: pointer; }
  .type-btn.active[data-type="expense"] { background: var(--expense-bg); color: var(--expense); }
  .type-btn.active[data-type="income"] { background: var(--income-bg); color: var(--income); }
  .amount-input {
    width: 100%; border: none; background: none; font-family: Georgia, serif; font-size: 32px;
    font-variant-numeric: tabular-nums; text-align: center; color: var(--ink); margin-bottom: 14px; outline: none;
  }
  .amount-input::placeholder { color: var(--rule); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft); font-size: 12.5px; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
  .chip.selected { border-color: transparent; }
  .chip.selected[data-mode="expense"] { background: var(--expense-bg); color: var(--expense); }
  .chip.selected[data-mode="income"] { background: var(--income-bg); color: var(--income); }
  .chip.method.selected { background: var(--accent); color: var(--accent-contrast); border-color: transparent; }
  .sync-note { font-size: 11px; color: var(--ink-soft); opacity: 0.7; margin: -6px 0 12px 2px; }
  .desc-input { width: 100%; border: none; border-bottom: 1px solid var(--rule); background: none; padding: 8px 2px; font-size: 14px; color: var(--ink); margin-bottom: 14px; outline: none; }
  .desc-input::placeholder { color: var(--ink-soft); opacity: 0.6; }
  .form-footer { display: flex; align-items: center; gap: 10px; }
  .date-input { flex: 1; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); padding: 9px 10px; font-size: 13px; color: var(--ink-soft); }
  .add-btn { background: var(--accent); color: var(--accent-contrast); border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .add-btn:active { opacity: 0.85; }
  .ledger-section h2, .breakdown-section h2 { font-size: 13.5px; font-weight: 600; color: var(--ink-soft); margin: 0 0 10px 2px; }
  .date-heading { font-size: 11.5px; color: var(--ink-soft); padding: 10px 2px 4px; }
  .entry-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--rule); animation: slideIn 0.25s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .entry-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .entry-category { font-size: 14px; color: var(--ink); }
  .entry-desc { font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .entry-amount { font-family: Georgia, serif; font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .entry-amount.income { color: var(--income); }
  .entry-amount.expense { color: var(--expense); }
  .entry-delete { background: none; border: none; color: var(--rule); font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .entry-delete:active { color: var(--expense); }
  .empty-state { text-align: center; color: var(--ink-soft); font-size: 13.5px; padding: 30px 10px; }
  .breakdown-section { margin-top: 28px; }
  .breakdown-row { margin-bottom: 12px; }
  .breakdown-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .breakdown-cat { color: var(--ink); }
  .breakdown-amt { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .breakdown-bar-track { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; background: var(--expense); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="top-row">
    <span class="app-name">Mis cuentas</span>
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mes anterior">‹</button>
      <span id="monthLabel"></span>
      <button id="nextMonth" aria-label="Mes siguiente">›</button>
    </div>
  </div>

  <div class="hero">
    <div class="balance-number" id="balanceNumber">$0</div>
    <div class="balance-label">balance del mes</div>
    <div class="stats-row">
      <div class="stat-income">
        <div class="stat-value" id="incomeTotal">$0</div>
        <div class="stat-label">ingresos</div>
      </div>
      <div class="stat-expense">
        <div class="stat-value" id="expenseTotal">$0</div>
        <div class="stat-label">gastos</div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="type-toggle">
      <button class="type-btn active" data-type="expense">Gasto</button>
      <button class="type-btn" data-type="income">Ingreso</button>
    </div>
    <input type="number" id="amountInput" class="amount-input" placeholder="$0.00" inputmode="decimal" step="0.01" />
    <div class="chips" id="categoryChips"></div>
    <div class="chips" id="paymentChips"></div>
    <input type="text" id="descInput" class="desc-input" placeholder="Descripción (opcional)" />
    <div class="form-footer">
      <input type="date" id="dateInput" class="date-input" />
      <button id="addBtn" class="add-btn">Agregar</button>
    </div>
  </div>

  <div class="ledger-section">
    <h2>Movimientos</h2>
    <div id="entriesList"></div>
    <div class="empty-state" id="emptyState" hidden>Aún no registras movimientos este mes.</div>
  </div>

  <div class="breakdown-section" id="breakdownSection" hidden>
    <h2>Gastos por categoría</h2>
    <div id="breakdownList"></div>
  </div>
</div>

<script>
  const CATEGORIES = {
    expense: ['Comida','Transporte','Renta','Servicios','Entretenimiento','Salud','Educación','Otro'],
    income: ['Beca','Trabajo','Familia','Ventas','Otro']
  };
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const PAYMENT_METHODS = ['Efectivo', 'TDC', 'TDB'];

  // Pega aquí la URL de tu Web App de Apps Script (termina en /exec).
  // Mientras no la configures, el HTML sigue funcionando solo de forma local.
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzZzPib2eDJCz-e7ztOU_AXxZAAsKZx0dwrEw16SYvMudm-sWYx8fhyNXIqJbBKgodLA/exec';

  let entries = [];
  let currentType = 'expense';
  let selectedCategory = CATEGORIES.expense[0];
  let selectedPaymentMethod = PAYMENT_METHODS[0];
  let viewDate = new Date();
  viewDate.setDate(1);

  const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt0 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 0, maximumFractionDigits: 0 });

  function todayStr() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off * 60000);
    return local.toISOString().slice(0, 10);
  }

  function loadEntries() {
    try {
      const raw = localStorage.getItem('mis-cuentas:entries');
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return [];
  }

  function saveEntries() {
    try {
      localStorage.setItem('mis-cuentas:entries', JSON.stringify(entries));
    } catch (e) { console.error('No se pudo guardar', e); }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function isSheetConfigured() {
    return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === -1;
  }

  function queuePending(id) {
    try {
      const raw = localStorage.getItem('mis-cuentas:pending_sync');
      const pending = raw ? JSON.parse(raw) : [];
      if (!pending.includes(id)) pending.push(id);
      localStorage.setItem('mis-cuentas:pending_sync', JSON.stringify(pending));
    } catch (e) {}
  }

  function entryPayload(entry) {
    return JSON.stringify({
      fecha: entry.date,
      tipo: entry.type === 'income' ? 'Ingreso' : 'Gasto',
      categoria: entry.category,
      metodoPago: entry.paymentMethod || '',
      monto: entry.amount,
      notas: entry.description || ''
    });
  }

  async function syncToSheet(entry) {
    if (!isSheetConfigured()) return;
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: entryPayload(entry)
      });
    } catch (e) {
      queuePending(entry.id);
    }
  }

  async function flushPending() {
    if (!isSheetConfigured()) return;
    let pending = [];
    try {
      const raw = localStorage.getItem('mis-cuentas:pending_sync');
      pending = raw ? JSON.parse(raw) : [];
    } catch (e) { return; }
    if (pending.length === 0) return;
    const stillPending = [];
    for (const id of pending) {
      const entry = entries.find(x => x.id === id);
      if (!entry) continue;
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
          body: entryPayload(entry)
        });
      } catch (e) { stillPending.push(id); }
    }
    try { localStorage.setItem('mis-cuentas:pending_sync', JSON.stringify(stillPending)); } catch (e) {}
  }

  function renderPaymentChips() {
    const wrap = document.getElementById('paymentChips');
    wrap.innerHTML = '';
    PAYMENT_METHODS.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'chip method' + (m === selectedPaymentMethod ? ' selected' : '');
      btn.textContent = m;
      btn.onclick = () => { selectedPaymentMethod = m; renderPaymentChips(); };
      wrap.appendChild(btn);
    });
  }

  function renderChips() {
    const wrap = document.getElementById('categoryChips');
    wrap.innerHTML = '';
    CATEGORIES[currentType].forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (cat === selectedCategory ? ' selected' : '');
      btn.dataset.mode = currentType;
      btn.textContent = cat;
      btn.onclick = () => { selectedCategory = cat; renderChips(); };
      wrap.appendChild(btn);
    });
  }

  function setType(type) {
    currentType = type;
    selectedCategory = CATEGORIES[type][0];
    document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    renderChips();
  }

  function monthEntries() {
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    return entries.filter(e => {
      const d = new Date(e.date + 'T00:00:00');
      return d.getFullYear() === y && d.getMonth() === m;
    });
  }

  function renderAll() {
    document.getElementById('monthLabel').textContent = `${MONTHS[viewDate.getMonth()]} ${viewDate.getFullYear()}`;

    const monthList = monthEntries();
    const income = monthList.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const expense = monthList.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    const balance = income - expense;

    const balEl = document.getElementById('balanceNumber');
    balEl.textContent = fmt0.format(balance);
    balEl.classList.toggle('negative', balance < 0);
    document.getElementById('incomeTotal').textContent = fmt0.format(income);
    document.getElementById('expenseTotal').textContent = fmt0.format(expense);

    const listEl = document.getElementById('entriesList');
    const emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';
    if (monthList.length === 0) {
      emptyEl.hidden = false;
    } else {
      emptyEl.hidden = true;
      const sorted = [...monthList].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
      let lastDate = null;
      sorted.forEach(e => {
        if (e.date !== lastDate) {
          lastDate = e.date;
          const d = new Date(e.date + 'T00:00:00');
          const h = document.createElement('div');
          h.className = 'date-heading';
          h.textContent = `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
          listEl.appendChild(h);
        }
        const row = document.createElement('div');
        row.className = 'entry-row';
        const methodPart = e.paymentMethod ? ` · ${escapeHtml(e.paymentMethod)}` : '';
        row.innerHTML = `
          <div class="entry-left">
            <span class="entry-category">${escapeHtml(e.category)}${methodPart}</span>
            ${e.description ? `<span class="entry-desc">${escapeHtml(e.description)}</span>` : ''}
          </div>
          <div class="entry-right">
            <span class="entry-amount ${e.type}">${e.type === 'expense' ? '-' : '+'}${fmt.format(e.amount)}</span>
            <button class="entry-delete" data-id="${e.id}" aria-label="Eliminar">×</button>
          </div>`;
        listEl.appendChild(row);
      });
      listEl.querySelectorAll('.entry-delete').forEach(btn => {
        btn.onclick = () => deleteEntry(btn.dataset.id);
      });
    }

    const breakdownSection = document.getElementById('breakdownSection');
    const breakdownList = document.getElementById('breakdownList');
    const expenseEntries = monthList.filter(e => e.type === 'expense');
    if (expenseEntries.length === 0) {
      breakdownSection.hidden = true;
    } else {
      breakdownSection.hidden = false;
      const totals = {};
      expenseEntries.forEach(e => { totals[e.category] = (totals[e.category] || 0) + e.amount; });
      const maxVal = Math.max(...Object.values(totals));
      const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      breakdownList.innerHTML = '';
      rows.forEach(([cat, amt]) => {
        const row = document.createElement('div');
        row.className = 'breakdown-row';
        row.innerHTML = `
          <div class="breakdown-top">
            <span class="breakdown-cat">${escapeHtml(cat)}</span>
            <span class="breakdown-amt">${fmt0.format(amt)}</span>
          </div>
          <div class="breakdown-bar-track">
            <div class="breakdown-bar-fill" style="width:${(amt / maxVal * 100).toFixed(0)}%"></div>
          </div>`;
        breakdownList.appendChild(row);
      });
    }
  }

  async function addEntry() {
    const amountInput = document.getElementById('amountInput');
    const amountVal = parseFloat(amountInput.value);
    if (!amountVal || amountVal <= 0) { amountInput.focus(); return; }
    const date = document.getElementById('dateInput').value || todayStr();
    const description = document.getElementById('descInput').value.trim();
    const newEntry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      type: currentType,
      category: selectedCategory,
      paymentMethod: selectedPaymentMethod,
      amount: amountVal,
      description,
      date,
      createdAt: Date.now()
    };
    entries.push(newEntry);
    await saveEntries();
    amountInput.value = '';
    document.getElementById('descInput').value = '';
    renderAll();
    syncToSheet(newEntry);
  }

  async function deleteEntry(id) {
    entries = entries.filter(e => e.id !== id);
    await saveEntries();
    renderAll();
  }

  document.querySelectorAll('.type-btn').forEach(b => b.onclick = () => setType(b.dataset.type));
  document.getElementById('addBtn').onclick = addEntry;
  document.getElementById('prevMonth').onclick = () => { viewDate.setMonth(viewDate.getMonth() - 1); renderAll(); };
  document.getElementById('nextMonth').onclick = () => { viewDate.setMonth(viewDate.getMonth() + 1); renderAll(); };
  document.getElementById('dateInput').value = todayStr();

  (async function init() {
    entries = await loadEntries();
    renderChips();
    renderPaymentChips();
    renderAll();
    flushPending();
  })();
</script>
</body>
</html>
